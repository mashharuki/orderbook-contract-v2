[profile.default]
src = "src"
out = "out"
cache_path = "cache"
solc_version = "0.5.16"
optimizer = true
optimizer_runs = 200
evm_version = "istanbul"

# Isolated from the parent Foundry project:
# the main Sera repo uses 0.8.24 with via_ir; this sub-project
# compiles the *original* Compound/Uniswap 0.5.16 Timelock bytecode
# so the deployed code matches the battle-tested governance timelock
# used by Uniswap (0x1a9C8182C09F50C8318d769245beA52c32BE35BC) and
# many other protocols.
