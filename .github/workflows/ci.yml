name: CI

on:
  pull_request:
    branches: ['*']
  push:
    branches: [audit]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Lint
        run: forge lint

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv
